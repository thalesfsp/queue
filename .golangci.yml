version: "2"
linters:
  default: all
  disable:
    - contextcheck
    - depguard
    - err113
    - exhaustruct
    - funcorder      # new in v2, opinionated method-ordering; churns untouched files
    - gochecknoglobals
    - godox
    - interfacebloat
    - ireturn
    - lll
    - mnd
    - noctx
    - noinlineerr    # new in v2, inline `if err := ...` is house style
    - perfsprint
    - tagliatelle
    - testifylint
    - varnamelen
    - wrapcheck
    - wsl            # deprecated in v2, superseded by wsl_v5
    - wsl_v5         # v1 disabled wsl globally; keep its successor off to match intent
  settings:
    cyclop:
      max-complexity: 25
      package-average: 0
    funlen:
      lines: 250
      statements: 70
    revive:
      rules:
        - name: unused-parameter
          disabled: true
    wsl:
      allow-trailing-comment: true
      allow-separated-leading-comment: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - exhaustivestruct
          - exhaustruct
          - forbidigo
          - gochecknoinits
          - mnd
          - nestif
          - staticcheck
          - varnamelen
          - wsl
        path: cmd/
      - linters:
          - unused
        path: auth.go
      - linters:
          - lll
        path: example_test.go
      - linters:
          - nlreturn
          - unparam
        path: http/
      - linters:
          - govet
        path: mongo*
      - linters:
          - cyclop
          - testpackage
        path: test.go
      - linters:
          - containedctx
          - err113
          - funlen
          - gocognit
          - goconst
          - govet
          - ifshort
          - lll
          - maintidx
          - maligned
          - nlreturn
          - paralleltest
          - scopelint
          - wsl
        path: _test\.go
      - linters:
          - lll
        path: doc.go
      - linters:
          - nosnakecase
        path: example_test.go
      - linters:
          - wsl
        path: resource.go
      - linters:
          - nosnakecase
        text: O_WRONLY|O_RDWR|O_CREATE|O_TRUNC|O_APPEND
      - linters:
          - lll
        source: 'json:'
      - linters:
          - gocritic
          - godot
          - lll
          - wsl
        source: //////
      - linters:
          - gocritic
          - godot
          - lll
        source: //
      - linters:
          - cyclop
        path: (.+)_test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - postgres.go
      - sqlite/sqlite.go
